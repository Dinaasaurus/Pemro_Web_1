<html>
    <head>
        <style type="text/css">
            img.x1 {
                position:absolute;
                left: 0;
                top: 0;
                z-index: 1;
            }
            img.x2 {
                position:absolute;
                left: 0;
                top: 100;
                z-index: -1;
            }
        </style>
    </head>
    <body>
        <p><b>catatan:</b>Netscape 4 tidak mendukung properti seperti "z-index"</p>
        <h1>sepertinya heading ini terhalang oleh gambar</h1>
        <img class="x1" src="Sparxie.gif" width="100" height="80">
        <p>nilai default z-index adalah 0. Z-index -1 memiliki popularitas lebih rendah</p>
        <p></p>
        <img class="x2" src="Sparxie.gif" width="100" height="80">
        <p>sekarang anda bisa membandingkan dengan tampilan di bagian bawah ini. Apakah masih terhalang gambar?</p>
    </body>
</html>
