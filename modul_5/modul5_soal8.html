<html>
    <body>
        <p>klik tombol berikut untuk menampilkan konfirmasi</p>
        <button onclick="myFunction()">Klik Saya</button>
        <p id="demo"></p>
        <script>
            function myFunction() {
                var x;
                var r = confirm("Apakah Anda ingin melanjutkan?");
                if (r == true) {
                    x = "Anda menekan tombol 'OK'";
                } else {
                    x = "Anda menekan tombol 'cancel'";
                }
                document.getElementById("demo").innerHTML = x;
            }
        </script>
    </body>
</html>
