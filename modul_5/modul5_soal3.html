<!DOCTYPE html>
<html>
    <body>
        <h1>latihan javascript></h1>
        <p id="demo">
            javascript bisa merubah isi elemen HTML</p>
        <script>
            function myFunction() 
            {
                x=document.getElementById("demo");
                x.style.color="#f8dfca";
            }
        </script>
        <button type="button" onclick="myFunction()">click here</button>
    </body>
</html>
