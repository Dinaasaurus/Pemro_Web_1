<!DOCTYPE html>
<html>
    <body>
        <h1>latihan javascript</h1>
        <p id="demo">
            javascript bisa merubah isi elemen HTML
        </p>
        <script>
            function myFunction() 
            {
                x=document.getElementById("demo");
                x.innerHTML="ini isi terbaru";
            }
        </script>
        <button type="button" onclick="myFunction()">click here</button>
    </body>
</html>
