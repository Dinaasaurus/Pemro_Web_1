        <style>
            body { font-family: "Playfair Display", serif; color: #333; }
            h1, h2, h3, h4, .navbar-brand { font-family: "Playfair Display", serif; font-weight: 700; color: #111; }
            p { font-family: "Source Sans Pro", sans-serif; }

            .main-header { margin-top: 50px; margin-bottom: 30px; align-items: center; display: flex; flex-wrap: wrap; }
            .navbar-brand { font-size: 26px; text-decoration: none; display: block; padding-top: 8px; }
            .navbar-brand:hover { text-decoration: none; color: #111; }
            
            .nav-menu { list-style: none; padding: 0; margin: 0; display: flex; gap: 20px; align-items: center; justify-content: flex-end; width: 100%; }
            .nav-menu a { color: #888; font-family: "Source Sans Pro", sans-serif; font-size: 11px; font-weight: bold; text-transform: uppercase; text-decoration: none; letter-spacing: 1px; }
            .nav-menu a.home-btn { border: 1px solid #eee; padding: 10px 22px; border-radius: 25px; color: #333; }

            .hero-section { margin-top: 80px; margin-bottom: 50px; text-align: center; max-width: 700px; margin-left: auto; margin-right: auto; }
            .hero-section h1, .hero-section h2 { margin-bottom: 5px; font-size: 28px; line-height: 1.2; }
            .hero-subtitle-small { font-family: "Source Sans Pro", sans-serif; font-size: 10px; letter-spacing: 2.5px; color: #aaa; text-transform: uppercase; margin-top: 15px; }

            .filter-tabs { margin: 40px 0; text-align: center; }
            .filter-tabs a { display: inline-block; padding: 7px 22px; margin: 0 4px; color: #888; text-decoration: none; font-family: "Source Sans Pro", sans-serif; font-size: 11px; font-weight: 600; border-radius: 20px; text-transform: uppercase; }
            .filter-tabs a.active { border: 1px solid #eee; color: #333; font-weight: 700; }

            .css-grid-gallery {
                display: grid;
                grid-template-columns: repeat(3, 1fr); 
                gap: 15px; 
                padding: 0 15px;
            }

            .landscape-container {
                position: relative;
                width: 100%;
                padding-top: 66.66%; 
                background-color: #f0f0f0; 
                overflow: hidden;
            }

            .landscape-container img {
                position: absolute; 
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                object-fit: cover; 
                display: block;
            }

            .footer { text-align: center; margin-top: 100px; padding: 60px 0; border-top: 1px solid #f4f4f4; }
            .footer h4 { font-family:serif; font-weight: bold; margin-bottom: 5px; color: #222; font-size: 18px; }

            .social-icons { margin-top: 25px; display: flex; justify-content: center; gap: 15px; }
            .social-icons a { color: #bbb; font-size: 14px; text-decoration: none; transition: color 0.2s; }
            .social-icons a:hover { color: #111; }
        </style>
        
        <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Source+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet">
